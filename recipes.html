<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipes — MunchReviews</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
</head>
<body>

  <!-- Nav -->
  <nav>
    <a href="index.html" class="nav-logo">Munch<span>Reviews</span></a>
    <div style="position:relative;">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">&#8942;</button>
      <div class="menu-dropdown" id="menuDropdown">
        <a href="index.html"><span class="icon">🏠</span> Home</a>
        <a href="reviews.html"><span class="icon">🍽️</span> All Reviews</a>
        <a href="submit.html"><span class="icon">✍️</span> Leave a Review</a>
        <a href="recipes.html"><span class="icon">📖</span> Recipes</a>
        <a href="submit-recipe.html"><span class="icon">🍳</span> Add a Recipe</a>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="page-header">
      <h1>Recipes</h1>
      <p>Search by meal name or author</p>
    </div>

    <!-- Search + filter -->
    <div class="search-wrap">
      <input
        type="search"
        class="search-input"
        id="searchInput"
        placeholder="🔍  Search recipes..."
        autocomplete="off"
      >
      <select class="filter-select" id="sortSelect">
        <option value="created_at">Newest first</option>
        <option value="rating">Highest rated</option>
      </select>
    </div>

    <!-- Results count -->
    <p id="resultsCount" style="color:var(--text-muted);font-size:0.88rem;margin-bottom:20px;"></p>

    <!-- Cards -->
    <div class="cards-grid" id="recipesGrid">
      <div class="empty-state">
        <span class="big-emoji">⏳</span>
        <p>Loading recipes...</p>
      </div>
    </div>
  </main>

  <!-- Supabase + App -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script>
    initNav();

    const grid        = document.getElementById('recipesGrid');
    const searchInput = document.getElementById('searchInput');
    const sortSelect  = document.getElementById('sortSelect');
    const countEl     = document.getElementById('resultsCount');

    let debounceTimer;

    async function load() {
      grid.innerHTML = `<div class="empty-state"><span class="big-emoji">⏳</span><p>Loading...</p></div>`;
      try {
        const recipes = await fetchRecipes({
          search: searchInput.value,
          sortBy: sortSelect.value,
        });

        grid.innerHTML = '';

        countEl.textContent = recipes.length
          ? `${recipes.length} recipe${recipes.length !== 1 ? 's' : ''} found`
          : '';

        if (recipes.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <span class="big-emoji">🤷</span>
              <p>${searchInput.value.trim() ? 'No recipes match your search.' : 'No recipes yet — add the first one!'}</p>
              ${searchInput.value.trim() ? '' : '<a href="submit-recipe.html" class="btn btn-primary" style="margin-top:16px;">Add a Recipe 🍳</a>'}
            </div>`;
          return;
        }

        recipes.forEach(r => grid.appendChild(buildRecipeCard(r)));
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="empty-state"><span class="big-emoji">⚠️</span><p>Couldn't load recipes right now.</p></div>`;
      }
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(load, 350);
    });

    sortSelect.addEventListener('change', load);

    load();
  </script>

</body>
</html>

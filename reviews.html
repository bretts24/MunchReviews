<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>All Reviews — MunchReviews</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
</head>
<body>

  <!-- Nav -->
  <nav>
    <a href="index.html" class="nav-logo">Munch<span>Reviews</span></a>
    <div style="position:relative;">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">&#8942;</button>
      <div class="menu-dropdown" id="menuDropdown">
        <a href="index.html"><span class="icon">🏠</span> Home</a>
        <a href="reviews.html"><span class="icon">🍽️</span> All Reviews</a>
        <a href="submit.html"><span class="icon">✍️</span> Leave a Review</a>
        <a href="recipes.html"><span class="icon">📖</span> Recipes</a>
        <a href="submit-recipe.html"><span class="icon">🍳</span> Add a Recipe</a>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="page-header">
      <h1>All Reviews</h1>
      <p>Search by restaurant, food type, or location</p>
    </div>

    <!-- Search + filter -->
    <div class="search-wrap">
      <input
        type="search"
        class="search-input"
        id="searchInput"
        placeholder="🔍  Search restaurant, food type, or city..."
        autocomplete="off"
      >
      <select class="filter-select" id="sortSelect">
        <option value="created_at">Newest first</option>
        <option value="rating">Highest rated</option>
      </select>
    </div>

    <!-- Active rating filter banner -->
    <div id="ratingFilterBanner" style="display:none;margin-bottom:16px;"></div>

    <!-- Results count -->
    <p id="resultsCount" style="color:var(--text-muted);font-size:0.88rem;margin-bottom:20px;"></p>

    <!-- Cards -->
    <div class="cards-grid" id="reviewsGrid">
      <div class="empty-state">
        <span class="big-emoji">⏳</span>
        <p>Loading reviews...</p>
      </div>
    </div>
  </main>

  <!-- Supabase + App -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script>
    initNav();

    const grid        = document.getElementById('reviewsGrid');
    const searchInput = document.getElementById('searchInput');
    const sortSelect  = document.getElementById('sortSelect');
    const countEl     = document.getElementById('resultsCount');
    const filterBanner = document.getElementById('ratingFilterBanner');

    // Read ?rating= from URL
    const urlParams   = new URLSearchParams(window.location.search);
    const ratingSlug  = urlParams.get('rating');
    const ratingRange = ratingSlug ? RATING_RANGES[ratingSlug] : null;

    if (ratingRange && ratingSlug) {
      const meta = getRatingMeta(ratingRange.min);
      const label = ratingRange.min === ratingRange.max
        ? `${ratingRange.min}/10`
        : `${ratingRange.min}–${ratingRange.max}/10`;
      filterBanner.style.display = 'flex';
      filterBanner.innerHTML = `
        <span class="rating-pill ${ratingSlug}" style="font-size:0.95rem;">
          ${meta.emoji} Filtered: ${meta.label} (${label})
        </span>
        <a href="reviews.html" style="margin-left:12px;font-size:0.85rem;color:var(--text-muted);text-decoration:underline;">Clear filter</a>
      `;
      filterBanner.style.alignItems = 'center';
      filterBanner.style.gap = '8px';
    }

    let debounceTimer;

    async function load() {
      grid.innerHTML = `<div class="empty-state"><span class="big-emoji">⏳</span><p>Loading...</p></div>`;
      try {
        const reviews = await fetchReviews({
          search: searchInput.value,
          sortBy: sortSelect.value,
          minRating: ratingRange ? ratingRange.min : null,
          maxRating: ratingRange ? ratingRange.max : null,
        });

        grid.innerHTML = '';

        countEl.textContent = reviews.length
          ? `${reviews.length} review${reviews.length !== 1 ? 's' : ''} found`
          : '';

        if (reviews.length === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <span class="big-emoji">🤷</span>
              <p>${searchInput.value.trim() ? 'No reviews match your search.' : 'No reviews yet — drop the first one!'}</p>
              ${searchInput.value.trim() ? '' : '<a href="submit.html" class="btn btn-primary" style="margin-top:16px;">Leave a Review ✍️</a>'}
            </div>`;
          return;
        }

        reviews.forEach(r => grid.appendChild(buildCard(r)));
      } catch (err) {
        console.error(err);
        grid.innerHTML = `<div class="empty-state"><span class="big-emoji">⚠️</span><p>Couldn't load reviews right now.</p></div>`;
      }
    }

    searchInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(load, 350);
    });

    sortSelect.addEventListener('change', load);

    load();
  </script>

</body>
</html>

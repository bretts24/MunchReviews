<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add a Recipe — MunchReviews</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍔</text></svg>">
</head>
<body>

  <!-- Nav -->
  <nav>
    <a href="index.html" class="nav-logo">Munch<span>Reviews</span></a>
    <div style="position:relative;">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">&#8942;</button>
      <div class="menu-dropdown" id="menuDropdown">
        <a href="index.html"><span class="icon">🏠</span> Home</a>
        <a href="reviews.html"><span class="icon">🍽️</span> All Reviews</a>
        <a href="submit.html"><span class="icon">✍️</span> Leave a Review</a>
        <a href="recipes.html"><span class="icon">📖</span> Recipes</a>
        <a href="submit-recipe.html"><span class="icon">🍳</span> Add a Recipe</a>
      </div>
    </div>
  </nav>

  <main class="page">
    <div class="page-header">
      <h1>Add a Recipe 🍳</h1>
      <p>Share something worth cooking.</p>
    </div>

    <form class="form-card" id="recipeForm" novalidate>

      <!-- Author name -->
      <div class="form-group">
        <label for="authorName">Your Name <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted);">(optional)</span></label>
        <input
          type="text"
          id="authorName"
          class="form-input"
          placeholder="e.g. Brett"
          maxlength="60"
        >
      </div>

      <!-- Meal name -->
      <div class="form-group">
        <label for="mealName">Meal Name *</label>
        <input
          type="text"
          id="mealName"
          class="form-input"
          placeholder="e.g. Smash Burgers with Special Sauce"
          maxlength="120"
          required
        >
      </div>

      <!-- Prep time -->
      <div class="form-group">
        <label for="prepTime">Prep Time <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted);">(optional)</span></label>
        <input
          type="text"
          id="prepTime"
          class="form-input"
          placeholder="e.g. 30 mins, 1 hr 15 mins"
          maxlength="60"
        >
      </div>

      <!-- Ingredients -->
      <div class="form-group">
        <label>Ingredients *</label>
        <div class="ingredient-header">
          <span class="col-amount">Amount / Unit</span>
          <span class="col-item">Ingredient</span>
        </div>
        <div class="dynamic-list" id="ingredientList"></div>
        <button type="button" class="add-row-btn" id="addIngredient">＋ Add Ingredient</button>
      </div>

      <!-- Equipment -->
      <div class="form-group">
        <label>Kitchen Equipment <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted);">(optional)</span></label>
        <div class="dynamic-list" id="equipmentList"></div>
        <button type="button" class="add-row-btn" id="addEquipment">＋ Add Equipment</button>
      </div>

      <!-- Rating slider -->
      <div class="form-group">
        <label>Rating *</label>
        <div class="rating-group">
          <div class="rating-display">
            <span class="rating-number" id="ratingNumber">5</span>
            <div>
              <div class="rating-label-text" id="ratingLabelText">Mids 😐</div>
              <div style="font-size:0.78rem;color:var(--text-muted);">out of 10</div>
            </div>
          </div>
          <div class="slider-wrap">
            <input
              type="range"
              class="rating-slider"
              id="ratingSlider"
              min="1"
              max="10"
              value="5"
            >
            <div class="rating-labels">
              <span>1 · Poo 💩</span>
              <span>5 · Mids 😐</span>
              <span>10 · Holy Shit 🤯</span>
            </div>
          </div>
        </div>
      </div>

      <!-- Photos -->
      <div class="form-group">
        <label>Photos <span style="font-weight:400;text-transform:none;letter-spacing:0;color:var(--text-muted);">(optional — up to 5)</span></label>
        <div class="upload-zone" id="uploadZone">
          <input
            type="file"
            id="photoInput"
            accept="image/*"
            multiple
          >
          <div class="upload-icon">📷</div>
          <p><strong>Click to upload</strong> or drag & drop</p>
          <p>JPG, PNG, WEBP · max 5 photos</p>
        </div>
        <div class="photo-previews" id="photoPreviews"></div>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn btn-primary" id="submitBtn" style="width:100%;justify-content:center;border-radius:8px;padding:15px;">
        Post Recipe 🍳
      </button>

    </form>
  </main>

  <!-- Supabase + App -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
  <script>
    initNav();

    // ---- Rating slider ----------------------------------------
    const slider       = document.getElementById('ratingSlider');
    const ratingNumber = document.getElementById('ratingNumber');
    const ratingLabel  = document.getElementById('ratingLabelText');

    function updateRatingDisplay() {
      const val  = +slider.value;
      const meta = getRatingMeta(val);
      ratingNumber.textContent = val;
      const colorMap = { poo: '#c87941', shwag: '#c4784a', mids: '#d4ad3a', chronic: '#66bb6a', gas: '#ffb74d', holyshit: '#ff7070' };
      ratingNumber.style.color = colorMap[meta.cls] || '#66bb6a';
      ratingLabel.textContent  = `${meta.label} ${meta.emoji}`;
    }

    slider.addEventListener('input', updateRatingDisplay);
    updateRatingDisplay();

    // ---- Dynamic ingredient rows ----------------------------------------
    const ingredientList = document.getElementById('ingredientList');

    function addIngredientRow(amount = '', item = '') {
      const row = document.createElement('div');
      row.className = 'dynamic-row';
      row.innerHTML = `
        <input type="text" class="form-input ing-amount-input" placeholder="e.g. 1 cup" value="${escHtml(amount)}" maxlength="60" style="width:130px;flex-shrink:0;">
        <input type="text" class="form-input ing-item-input"   placeholder="e.g. all-purpose flour" value="${escHtml(item)}" maxlength="120" style="flex:1;">
        <button type="button" class="remove-row-btn" title="Remove">✕</button>
      `;
      row.querySelector('.remove-row-btn').addEventListener('click', () => row.remove());
      ingredientList.appendChild(row);
    }

    document.getElementById('addIngredient').addEventListener('click', () => addIngredientRow());

    // Start with 3 blank ingredient rows
    addIngredientRow();
    addIngredientRow();
    addIngredientRow();

    // ---- Dynamic equipment rows ----------------------------------------
    const equipmentList = document.getElementById('equipmentList');

    function addEquipmentRow(value = '') {
      const row = document.createElement('div');
      row.className = 'dynamic-row';
      row.innerHTML = `
        <input type="text" class="form-input equip-input" placeholder="e.g. Cast iron skillet" value="${escHtml(value)}" maxlength="100" style="flex:1;">
        <button type="button" class="remove-row-btn" title="Remove">✕</button>
      `;
      row.querySelector('.remove-row-btn').addEventListener('click', () => row.remove());
      equipmentList.appendChild(row);
    }

    document.getElementById('addEquipment').addEventListener('click', () => addEquipmentRow());

    // Start with 2 blank equipment rows
    addEquipmentRow();
    addEquipmentRow();

    // ---- Photo upload ----------------------------------------
    const photoInput    = document.getElementById('photoInput');
    const photoPreviews = document.getElementById('photoPreviews');
    const uploadZone    = document.getElementById('uploadZone');
    let selectedFiles   = [];

    function renderPreviews() {
      photoPreviews.innerHTML = '';
      selectedFiles.forEach((file, i) => {
        const url  = URL.createObjectURL(file);
        const item = document.createElement('div');
        item.className = 'preview-item';
        item.innerHTML = `
          <img src="${url}" alt="preview">
          <button class="preview-remove" type="button" data-idx="${i}">✕</button>
        `;
        photoPreviews.appendChild(item);
      });

      photoPreviews.querySelectorAll('.preview-remove').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedFiles.splice(+btn.dataset.idx, 1);
          renderPreviews();
        });
      });
    }

    photoInput.addEventListener('change', () => {
      const incoming = Array.from(photoInput.files);
      selectedFiles  = [...selectedFiles, ...incoming].slice(0, 5);
      renderPreviews();
      photoInput.value = '';
    });

    uploadZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      uploadZone.classList.add('dragover');
    });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', (e) => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
      selectedFiles = [...selectedFiles, ...files].slice(0, 5);
      renderPreviews();
    });

    // ---- Form submit ----------------------------------------
    const form      = document.getElementById('recipeForm');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const authorName = document.getElementById('authorName').value.trim();
      const mealName   = document.getElementById('mealName').value.trim();
      const prepTime   = document.getElementById('prepTime').value.trim();
      const rating     = +slider.value;

      // Collect ingredients (skip rows where item is empty)
      const ingredients = Array.from(ingredientList.querySelectorAll('.dynamic-row')).map(row => ({
        amount: row.querySelector('.ing-amount-input').value.trim(),
        item:   row.querySelector('.ing-item-input').value.trim(),
      })).filter(ing => ing.item);

      // Collect equipment (skip empty rows)
      const equipment = Array.from(equipmentList.querySelectorAll('.equip-input'))
        .map(inp => inp.value.trim())
        .filter(Boolean);

      if (!mealName) {
        showToast('Please enter a meal name.', 'error');
        return;
      }
      if (ingredients.length === 0) {
        showToast('Please add at least one ingredient.', 'error');
        return;
      }

      submitBtn.disabled    = true;
      submitBtn.textContent = 'Posting... 🍳';

      try {
        let photoUrls = [];
        if (selectedFiles.length > 0) {
          submitBtn.textContent = 'Uploading photos... 📸';
          photoUrls = await uploadRecipePhotos(selectedFiles);
        }

        const { error } = await db.from('recipes').insert({
          author_name: authorName || null,
          meal_name:   mealName,
          prep_time:   prepTime  || null,
          ingredients,
          equipment,
          rating,
          photo_urls:  photoUrls,
        });

        if (error) throw error;

        showToast('Recipe posted! 🔥', 'success');
        setTimeout(() => window.location.href = 'recipes.html', 1200);

      } catch (err) {
        console.error(err);
        showToast('Something went wrong. Try again.', 'error');
        submitBtn.disabled    = false;
        submitBtn.textContent = 'Post Recipe 🍳';
      }
    });
  </script>

</body>
</html>
